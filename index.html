  /* ✅ Main App Layout */

    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: white;
  }

  /* ✅ Scrollable Content Area */
  #content {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    box-sizing: border-box;
  }

  /* ✅ Fixed Bottom Button */
  #buttonBar {
    padding: 15px;
    border-top: 1px solid #ddd;
    background: white;
    text-align: center;
  }

  button {
    padding: 16px 45px;
    font-size: 20px;
    border: none;
    border-radius: 14px;
    background: black;
    color: white;
    cursor: pointer;
    width: 90%;
    max-width: 350px;
  }

  /* ✅ Final Check Animation */
  .checkmark {
    font-size: 90px;
    text-align: center;
    margin: 20px 0;
    animation: pulse 1s infinite alternate;
  }

  @keyframes pulse {
    from { transform: scale(1); }
    to   { transform: scale(1.3); }
  }

  /* ✅ Lock Screen */
  #lockScreen {
    position: fixed;
    inset: 0;
    background: black;
    color: white;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-align: center;
    z-index: 99999;
  }

  #lockScreen h1 {
    font-size: 40px;
    margin: 0;
  }

  #lockScreen p {
    font-size: 18px;
    margin-top: 10px;
    color: #ddd;
  }
</style>
</head>
